[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-security-scanner"
dynamic = ["version"]
description = "Production-minded static, live, and configuration security scanner for Python MCP servers."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Jake Spillers" }]
keywords = ["mcp", "security", "sast", "sarif", "ai-security"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.optional-dependencies]
live = ["mcp>=1.28,<2"]
test = [
    "jsonschema>=4.20,<5",
    "pytest>=8.3",
    "pytest-cov>=5",
]
benchmark = ["jsonschema>=4.20,<5"]
dev = [
    "bandit>=1.8",
    "build>=1.2",
    "mypy>=1.11",
    "ruff>=0.8",
]

[project.scripts]
mcp-scanner = "mcp_scanner.cli:main"

[project.urls]
Homepage = "https://github.com/jspillers10/mcp-security-scanner"
Issues = "https://github.com/jspillers10/mcp-security-scanner/issues"
Repository = "https://github.com/jspillers10/mcp-security-scanner.git"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "mcp_scanner.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mcp_scanner"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests/fixtures", "benchmark/fixtures"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
files = ["src", "benchmark"]
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true
